services:
  api:
    build: .
    restart: unless-stopped
    ports: ["8000:8000"]
    environment:
      AEROSAFE_WHISPER_MODEL: ${AEROSAFE_WHISPER_MODEL:-small}
      AEROSAFE_WHISPER_DEVICE: ${AEROSAFE_WHISPER_DEVICE:-cpu}
      AEROSAFE_WHISPER_COMPUTE: ${AEROSAFE_WHISPER_COMPUTE:-int8}
      AEROSAFE_MAX_RETRIES: ${AEROSAFE_MAX_RETRIES:-2}
      AEROSAFE_AUDIT_PATH: ${AEROSAFE_AUDIT_PATH:-/data/audit.jsonl}
      AEROSAFE_CASES_PATH: ${AEROSAFE_CASES_PATH:-/data/cases.sqlite3}
      AEROSAFE_SOURCES_PATH: ${AEROSAFE_SOURCES_PATH:-/data/sources.sqlite3}
      AEROSAFE_AGENT_MODEL: ${AEROSAFE_AGENT_MODEL:-gpt-6.2-astra}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./data:/data
      - whisper_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  whisper_cache:
